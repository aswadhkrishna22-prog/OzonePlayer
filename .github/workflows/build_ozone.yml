name: Build Ozone Player APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ozone Player APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug -PnightlyVersionName="1.2.${{ github.run_number }}" --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk/gmsMobileUniversal/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" "release_assets/OzonePlayer-v1.2.${{ github.run_number }}.apk"
          cp "$APK_FILE" "release_assets/app-gms-mobile-universal-release.apk"

      - name: Upload Ozone Player Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-APK
          path: release_assets/*.apk

      - name: Publish GitHub Release for In-App Auto-Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" release_assets/*.apk \
            --title "Ozone Player v1.2.${{ github.run_number }}" \
            --generate-notes
