name: Build Ozone Player APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and upload artifact only; do not create release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Ozone Player APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify and Decode Release Signing Key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Release signing failed: Missing one or more required secrets (ANDROID_SIGNING_KEY, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD, SIGNING_STORE_PASSWORD)!"
            echo "Release builds must be signed with the stable repository key and cannot fall back to debug key."
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 -d > /tmp/release.jks

      - name: Build Universal Release APK (R8 Minified)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleGmsMobileUniversalRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password="${SIGNING_STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${SIGNING_KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${SIGNING_KEY_PASSWORD}" \
            -PnightlyVersionName="1.2.${{ github.run_number }}" \
            --stacktrace

      - name: Prepare Release Asset & Analyze Size
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk/gmsMobileUniversal/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Universal Release APK not found!"
            exit 1
          fi

          cp "$APK_FILE" "release_assets/OzonePlayer-v1.2.${{ github.run_number }}.apk"
          cp "$APK_FILE" "release_assets/app-gms-mobile-universal-release.apk"

          APK_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          echo "### 📦 Ozone Player Universal Release APK: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Uncompressed Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          unzip -l "$APK_FILE" | awk '
            /classes.*\.dex/ { dex += $1 }
            /res\// { res += $1 }
            /lib\// { lib += $1 }
            /assets\// { assets += $1 }
            /resources\.arsc/ { arsc += $1 }
            END {
              printf("| **DEX (Code)** | %.2f MB |\n", dex / (1024*1024));
              printf("| **Resources (res/)** | %.2f MB |\n", res / (1024*1024));
              printf("| **Resources Table (arsc)** | %.2f MB |\n", arsc / (1024*1024));
              printf("| **Native Libraries (lib/)** | %.2f MB |\n", lib / (1024*1024));
              printf("| **Assets** | %.2f MB |\n", assets / (1024*1024));
            }
          ' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Native Libraries Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          unzip -l "$APK_FILE" | grep "lib/" | awk '
            {
              split($NF, a, "/");
              if (a[2] != "") abi[a[2]] += $1;
            }
            END {
              for (i in abi) {
                printf("| %s | %.2f MB |\n", i, abi[i] / (1024*1024));
              }
            }
          ' >> $GITHUB_STEP_SUMMARY

      - name: Upload Ozone Player Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-APK
          path: release_assets/*.apk

      - name: Publish GitHub Release for In-App Auto-Update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (!inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" release_assets/*.apk \
            --title "Ozone Player v1.2.${{ github.run_number }}" \
            --generate-notes
