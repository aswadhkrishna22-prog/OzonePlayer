name: Build PR Debug APK

on:
  pull_request:
    branches: [ "main", "dev" ]
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Upload Debug & R8 Test APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :flaccore:test testGmsMobileUniversalDebugUnitTest --tests "moe.rukamori.archivetune.kemo.KemoStateTest" --tests "moe.rukamori.archivetune.beastmode.BeastModeTest" --tests "moe.rukamori.archivetune.playback.queue.SongVibeMatcherTest" --tests "moe.rukamori.archivetune.spotify.SpotifyPlaybackResolverTest" --tests "moe.rukamori.archivetune.spotify.SpotifyLazyTrackMatcherTest" --tests "moe.rukamori.archivetune.ui.screens.search.SearchSlideAnimationTest" --tests "moe.rukamori.archivetune.playback.resolvers.JioSaavnPlaybackResolutionTest" --tests "moe.rukamori.archivetune.ui.screens.playlist.PlaylistDownloadSheetTest" --tests "moe.rukamori.archivetune.ui.player.player_0.MiniPlayerRollingArtworkTest" --stacktrace

      - name: Build Normal Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug -Pdualplay=true --stacktrace

      - name: Build R8 Release Test APK
        run: ./gradlew assembleGmsMobileUniversalRelease -Prtest=true -PnightlyVersionName="1.3.${{ github.run_number }}" --stacktrace

      - name: Analyze APK Sizes & Summary
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/gmsMobileUniversal/debug -name "*.apk" | head -n 1)
          R8_APK=$(find app/build/outputs/apk/gmsMobileUniversal/release -name "*.apk" | head -n 1)

          DEBUG_SIZE=$(ls -lh "$DEBUG_APK" | awk '{print $5}')
          R8_SIZE=$(ls -lh "$R8_APK" | awk '{print $5}')

          {
            echo "## 📊 APK Comparison: Debug vs R8 Release"
            echo "| Build Variant | Compressed APK Size |"
            echo "| :--- | :--- |"
            echo "| **Normal Debug (Universal)** | $DEBUG_SIZE |"
            echo "| **R8 Minified Release (Universal)** | $R8_SIZE |"
            echo ""
            echo "### 🔍 R8 Release Breakdown"
            echo "| Component | Uncompressed Size |"
            echo "| :--- | :--- |"
          } | tee -a $GITHUB_STEP_SUMMARY

          unzip -l "$R8_APK" | awk '
            /classes.*\.dex/ { dex += $1 }
            /res\// { res += $1 }
            /lib\// { lib += $1 }
            /assets\// { assets += $1 }
            /resources\.arsc/ { arsc += $1 }
            END {
              printf("| **DEX (Code)** | %.2f MB |\n", dex / (1024*1024));
              printf("| **Resources (res/)** | %.2f MB |\n", res / (1024*1024));
              printf("| **Resources Table (arsc)** | %.2f MB |\n", arsc / (1024*1024));
              printf("| **Native Libraries (lib/)** | %.2f MB |\n", lib / (1024*1024));
              printf("| **Assets** | %.2f MB |\n", assets / (1024*1024));
            }
          ' | tee -a $GITHUB_STEP_SUMMARY

          {
            echo ""
            echo "#### Native Libraries Breakdown"
            echo "| ABI | Size |"
            echo "| :--- | :--- |"
          } | tee -a $GITHUB_STEP_SUMMARY

          unzip -l "$R8_APK" | grep "lib/" | awk '
            {
              split($NF, a, "/");
              if (a[2] != "") abi[a[2]] += $1;
            }
            END {
              for (i in abi) {
                printf("| %s | %.2f MB |\n", i, abi[i] / (1024*1024));
              }
            }
          ' | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-dualplay-debug
          path: app/build/outputs/apk/gmsMobileUniversal/debug/*.apk

      - name: Upload R8 Test Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-rtest-release
          path: app/build/outputs/apk/gmsMobileUniversal/release/*.apk
