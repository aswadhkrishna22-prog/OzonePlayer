name: Build PR Debug APK

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "feat/dual-play-ui" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Upload Debug APK Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug -Pdualplay=true --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-dualplay-debug
          path: app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
