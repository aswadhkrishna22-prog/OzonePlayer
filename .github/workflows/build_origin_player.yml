name: Build Origin Test Debug APK

on:
  push:
    branches:
      - "experiment/origin-player"
  pull_request:
    branches:
      - "experiment/origin-player"
  workflow_dispatch:

jobs:
  build:
    name: Build Origin Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Origin Test Debug and Default Debug APKs
        run: ./gradlew assembleOriginTestDebug assembleDefaultDebug --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p origin_test_apk
          find app/build/outputs/apk -type f -name "*.apk" -path "*originTest*" -exec cp {} origin_test_apk/ \;
          cd origin_test_apk
          for f in *.apk; do
            cp "$f" "OzonePlayer-OriginTest-Debug.apk"
            break
          done
          ls -la

      - name: Upload Origin Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzonePlayer-OriginTest-Debug-APK
          path: origin_test_apk/*.apk
